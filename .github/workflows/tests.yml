name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research:
    name: research tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run research tests
        run: |
          python research/fox_ears_v0_2_binding_grammar.py --test
          python research/fox_ears_v0_1.py --test

  app:
    name: app typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Listening lab tests (tempo + vocal)
        run: node --test --experimental-strip-types scripts/tempo-lab.test.mjs scripts/vocal-lab.test.mjs
      - run: npm run build
